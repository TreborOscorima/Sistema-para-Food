# =============================================================================
# docker-compose.yml — TUWAYKIFOOD producción (food.tuwayki.app)
#
# Stack 100% independiente de Sistema-de-Ventas — DB, red y proceso propios.
#
# PRIMERA VEZ:
#   1. cp .env.example .env && editar (DB_PASSWORD, MYSQL_ROOT_PASSWORD, AUTH_SECRET_KEY)
#   2. Crear red NPM si no existe: docker network create nginx-proxy-manager_default
#   3. bash scripts/deploy-prod.sh
#
# NPM (Proxy Host):
#   Domain: food.tuwayki.app | Forward: tuwayki_food:3000 | WebSockets ON
#
# Uso normal: bash scripts/deploy-prod.sh
# Para local: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Para test:  TEST_IP=<IP-EC2> docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
# =============================================================================

services:
  food_mysql:
    image: mysql:8.0
    container_name: food_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD requerido en .env}
      MYSQL_DATABASE: ${DB_NAME:-food_db}
      MYSQL_USER: ${DB_USER:-food}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requerido en .env}
    volumes:
      - food_mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
      - --max_connections=100
      - --innodb_buffer_pool_size=${MYSQL_INNODB_BUFFER_POOL:-256M}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h localhost -u root -e 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MYSQL_MEMORY_LIMIT:-768M}
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - food_internal

  tuwayki_food:
    build:
      context: .
      dockerfile: Dockerfile
    image: tuwayki_food:latest
    container_name: tuwayki_food
    restart: on-failure:10
    depends_on:
      food_mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ENV: prod
      DB_HOST: food_mysql
      PUBLIC_API_URL: https://food.tuwayki.app
      ALLOW_MEMORY_RATE_LIMIT_FALLBACK: "1"
    volumes:
      - food_web:/app/.web
      - food_uploads:/app/uploaded_files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    networks:
      - food_internal
      - food_npm_network

volumes:
  food_mysql_data:
  food_web:
  food_uploads:

networks:
  food_internal:
    driver: bridge

  food_npm_network:
    external: true
    name: nginx-proxy-manager_default
