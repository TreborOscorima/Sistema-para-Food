; Configuración del Agente de impresión TUWAYKIFOOD.
; Copia este archivo como "config.ini" (en la misma carpeta que el .exe) y
; completa el token que te da el sistema.
[agente]
; URL del sistema en la nube (dejar así salvo indicación).
base_url = https://food.tuwayki.app
; Token del agente (formato "<id>.<secreto>"), lo genera el sistema.
token =
; Cada cuántos segundos revisa si hay tickets nuevos.
poll_segundos = 3
